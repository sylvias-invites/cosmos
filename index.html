<!DOCTYPE html>
<html lang="cs">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=block" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svatební pozvánka</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-image: url("pozadi.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: sans-serif;
    }

    .scratch-screen {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      max-width: 600px;
      padding: 40px 20px;
      z-index: 2;
    }

    .main-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #2c2c2c;
      margin-top: 42px;
      font-weight: normal;
      text-align: center;
      z-index: 10;
    }

    /* Plátno pro animaci letadla a postupně kresleného srdce */
    #animationCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }


    /* Tlačítko dole */
    .next-btn {
      margin-bottom: 30px;
      padding: 12px 30px;
      background-color: rgba(255, 255, 255, 0.85);
      color: #2c2c2c;
      border: 1.5px solid #d4a373;
      border-radius: 30px;
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.3s ease, background-color 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      backdrop-filter: blur(5px);
      z-index: 10;
    }

    .next-btn.show {
      opacity: 1;
      pointer-events: auto;
    }

    .next-btn:hover {
      background-color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }
  </style>
</head>
<body>

  <canvas id="animationCanvas"></canvas>

  <div class="scratch-screen" id="scratch-screen">
    <h1 class="main-title" id="main-title">Míša a Alex</h1>
    

    <button class="next-btn" id="next-btn" onclick="openDetails()">Vstoupit na pozvánku &rarr;</button>
  </div>

  <script>
    const canvas = document.getElementById('animationCanvas');
    const ctx = canvas.getContext('2d');
    const ticketContainer = document.getElementById('ticket-container');
    const nextBtn = document.getElementById('next-btn');

    const planeImage = new Image();
    planeImage.src = 'plane.png';

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Celý obrys srdce (t od 0 do 2: 0->1 je levá půlka shora dolů, 1->2 je pravá půlka odspodu nahoru a zpět k vrcholu)
    function getHeartPointFull(t, centerX, centerY, scale) {
      let heartT;
      let isLeft = true;
      
      if (t <= 1) {
        // Levá strana srdce (shora dolů)
        heartT = t * Math.PI;
        isLeft = true;
      } else {
        // Pravá strana srdce (odspodu nahoru k vrcholu)
        heartT = (2 - t) * Math.PI;
        isLeft = false;
      }

      const sign = isLeft ? -1 : 1;
      const x = sign * 16 * Math.sin(heartT) ** 3;
      const y = -(13 * Math.cos(heartT) - 5 * Math.cos(2 * heartT) - 2 * Math.cos(3 * heartT) - Math.cos(4 * heartT));
      return {
        x: centerX + x * scale,
        y: centerY + y * scale
      };
    }

    // Trajektorie jednoho letadla:
    // 1. Přílet zleva (0.0 až 0.25)
    // 2. Kreslení celého srdce (0.25 až 0.85)
    // 3. Odlet doprava (0.85 až 1.0)
    function getPlanePath(progress, centerX, centerY, scale) {
      const w = canvas.width;
      const h = canvas.height;

      const startX = -100;
      const startY = h * 0.75;

      const heartStart = getHeartPointFull(0, centerX, centerY, scale);
      const heartEnd = getHeartPointFull(2, centerX, centerY, scale);

      const endX = w + 150;
      const endY = h * 0.45;

      if (progress <= 0.25) {
        // FÁZE 1: Přílet zleva k vrcholu srdce
        const p = progress / 0.25;
        const easeP = 1 - Math.pow(1 - p, 2);
        return {
          x: startX + (heartStart.x - startX) * easeP,
          y: startY + (heartStart.y - startY) * easeP,
          drawing: false
        };
      } else if (progress <= 0.85) {
        // FÁZE 2: Kreslení celého srdce (t jde od 0 do 2)
        const p = (progress - 0.25) / 0.60;
        const pt = getHeartPointFull(p * 2, centerX, centerY, scale);
        return {
          x: pt.x,
          y: pt.y,
          drawing: true
        };
      } else {
        // FÁZE 3: Odlet z vrcholu srdce doprava
        const p = (progress - 0.85) / 0.15;
        const easeP = p * p;
        return {
          x: heartEnd.x + (endX - heartEnd.x) * easeP,
          y: heartEnd.y + (endY - heartEnd.y) * easeP,
          drawing: false
        };
      }
    }

    function drawPlane(x, y, angle) {
      if (!planeImage.complete) return;
      
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      
      const width = 60;
      const height = (planeImage.height / planeImage.width) * width;
      
      ctx.drawImage(planeImage, -width / 2, -height / 2, width, height);
      ctx.restore();
    }

    let progress = 0;
    const speed = 0.0022; // Rychlost animace
    let animationFinished = false;

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height * 0.52;
      const scale = Math.min(canvas.width, canvas.height) / 38;

      // Nastavení stylu pro bílou čárkovanou čáru (stoupu za letadlem)
      ctx.beginPath();
      ctx.setLineDash([7, 7]);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
      ctx.lineWidth = 3.5;

      // Kreslení obrysu srdce podle toho, kam až letadlo doletělo ve Fázi 2
      let drawLimit = Math.min(Math.max((progress - 0.25) / 0.60, 0), 1) * 2;
      if (progress > 0.25) {
        let first = true;
        for (let i = 0; i <= drawLimit; i += 0.005) {
          const pt = getHeartPointFull(i, centerX, centerY, scale);
          if (first) {
            ctx.moveTo(pt.x, pt.y);
            first = false;
          } else {
            ctx.lineTo(pt.x, pt.y);
          }
        }
        ctx.stroke();
      }

      ctx.setLineDash([]); // Vypnout čárkování pro letadlo

      // Vykreslení letadla
      if (progress <= 1) {
        const pCurrent = getPlanePath(progress, centerX, centerY, scale);
        const pNext = getPlanePath(Math.min(progress + 0.005, 1), centerX, centerY, scale);
        const angle = Math.atan2(pNext.y - pCurrent.y, pNext.x - pCurrent.x);
        drawPlane(pCurrent.x, pCurrent.y, angle);

        progress += speed;
        requestAnimationFrame(animate);
      } else if (!animationFinished) {
  animationFinished = true;
     }
    }

    planeImage.onload = () => {
      animate();
    };

    function openDetails() {
      alert("Přechod na detail pozvánky...");
    }
  </script>
</body>
</html>
