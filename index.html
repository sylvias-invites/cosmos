<!DOCTYPE html>
<html lang="cs">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=block" rel="stylesheet">
  <!-- Načtení moderního fontu pro datum (Montserrat) -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
  
  <!-- Knihovna pro konfety -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svatební pozvánka</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-image: url("pozadi.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: sans-serif;
    }

    .scratch-screen {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      max-width: 600px;
      padding: 40px 20px;
      z-index: 2;
    }

    .main-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #2c2c2c;
      margin-top: 42px;
      font-weight: normal;
      text-align: center;
      z-index: 10;
    }

    /* Kontejner pro text uvnitř srdce */
    .heart-text-container {
      position: absolute;
      top: 53%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease;
      z-index: 5;
      pointer-events: none;
      width: 80%;
    }

    .heart-text-container.show {
      opacity: 1;
      visibility: visible;
    }

    .invite-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.8rem;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
      margin-bottom: 8px;
    }

    .date-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.1rem;
      letter-spacing: 3px;
      color: #ffffff;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
      font-weight: 300;
    }

    #animationCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Tlačítko dole */
    .next-btn {
      margin-bottom: 30px;
      padding: 12px 30px;
      background-color: rgba(255, 255, 255, 0.85);
      color: #2c2c2c;
      border: 1.5px solid #448DAD;
      border-radius: 30px;
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.3s ease, background-color 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      backdrop-filter: blur(5px);
      z-index: 10;
    }

    .next-btn.show {
      opacity: 1;
      pointer-events: auto;
    }

    .next-btn:hover {
      background-color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }
  </style>
</head>
<body>

  <canvas id="animationCanvas"></canvas>

  <div class="scratch-screen" id="scratch-screen">
    <h1 class="main-title" id="main-title">Péťa & Luky</h1>
    
    <!-- Text uvnitř srdce (původně skrytý) -->
    <div class="heart-text-container" id="heart-text-container">
      <div class="invite-text">Zveme Vás na naši svatbu</div>
      <div class="date-text">20.07.2027</div>
    </div>

    <button class="next-btn" id="next-btn" onclick="openDetails()">Vstoupit na pozvánku &rarr;</button>
  </div>

  <script>
    const canvas = document.getElementById('animationCanvas');
    const ctx = canvas.getContext('2d');
    const nextBtn = document.getElementById('next-btn');
    const heartTextContainer = document.getElementById('heart-text-container');

    const planeImage = new Image();
    planeImage.src = 'plane.png';

    const starsImage = new Image();
    starsImage.src = 'stars.png';

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function getHeartPointFull(t, centerX, centerY, scale) {
      let heartT;
      let isLeft = true;
      
      if (t <= 1) {
        heartT = t * Math.PI;
        isLeft = true;
      } else {
        heartT = (2 - t) * Math.PI;
        isLeft = false;
      }

      const sign = isLeft ? -1 : 1;
      const x = sign * 16 * Math.sin(heartT) ** 3;
      const y = -(13 * Math.cos(heartT) - 5 * Math.cos(2 * heartT) - 2 * Math.cos(3 * heartT) - Math.cos(4 * heartT));
      return {
        x: centerX + x * scale,
        y: centerY + y * scale
      };
    }

    function getPlanePath(progress, centerX, centerY, scale) {
      const w = canvas.width;
      const h = canvas.height;

      const startX = -100;
      const startY = h * 0.75;

      const heartStart = getHeartPointFull(0, centerX, centerY, scale);
      const heartEnd = getHeartPointFull(2, centerX, centerY, scale);

      const endX = w + 150;
      const endY = h * 0.45;

      if (progress <= 0.25) {
        const p = progress / 0.25;
        const easeP = 1 - Math.pow(1 - p, 2);
        return {
          x: startX + (heartStart.x - startX) * easeP,
          y: startY + (heartStart.y - startY) * easeP,
          drawing: false
        };
      } else if (progress <= 0.85) {
        const p = (progress - 0.25) / 0.60;
        const pt = getHeartPointFull(p * 2, centerX, centerY, scale);
        return {
          x: pt.x,
          y: pt.y,
          drawing: true
        };
      } else {
        const p = (progress - 0.85) / 0.15;
        const easeP = p * p;
        return {
          x: heartEnd.x + (endX - heartEnd.x) * easeP,
          y: heartEnd.y + (endY - heartEnd.y) * easeP,
          drawing: false
        };
      }
    }

    function drawPlane(x, y, angle) {
      if (!planeImage.complete) return;
      
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      
      const width = 100;
      const height = (planeImage.height / planeImage.width) * width;
      
      ctx.drawImage(planeImage, -width / 2, -height / 2, width, height);
      ctx.restore();
    }

    let progress = 0;
    const speed = 0.0022;
    let animationFinished = false;
    let starsCanvas = null;

    function getStarsPattern(centerX, centerY, scale) {
      if (starsCanvas) return starsCanvas;
      
      const offCanvas = document.createElement('canvas');
      offCanvas.width = canvas.width;
      offCanvas.height = canvas.height;
      const offCtx = offCanvas.getContext('2d');

      offCtx.beginPath();
      for (let i = 0; i <= 2; i += 0.005) {
        const pt = getHeartPointFull(i, centerX, centerY, scale);
        if (i === 0) offCtx.moveTo(pt.x, pt.y);
        else offCtx.lineTo(pt.x, pt.y);
      }
      offCtx.closePath();
      offCtx.clip();

      if (starsImage.complete && starsImage.naturalWidth !== 0) {
        offCtx.drawImage(starsImage, 0, 0, canvas.width, canvas.height);
      } else {
        offCtx.fillStyle = '#4a90e2';
        offCtx.fillRect(0, 0, canvas.width, canvas.height);
      }

      starsCanvas = offCanvas;
      return starsCanvas;
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height * 0.52;
      const scale = Math.min(canvas.width, canvas.height) / 38;

      // 1. Hvězdné pozadí uvnitř srdce (objeví se po odletu letadla)
      if (progress > 1) {
        const pattern = getStarsPattern(centerX, centerY, scale);
        ctx.drawImage(pattern, 0, 0);
      }

      // 2. Obrys srdce tvořený čárou za letadlem
      ctx.beginPath();
      ctx.setLineDash([7, 7]);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
      ctx.lineWidth = 3.5;

      let drawLimit = Math.min(Math.max((progress - 0.25) / 0.60, 0), 1) * 2;
      if (progress > 0.25) {
        let first = true;
        for (let i = 0; i <= drawLimit; i += 0.005) {
          const pt = getHeartPointFull(i, centerX, centerY, scale);
          if (first) {
            ctx.moveTo(pt.x, pt.y);
            first = false;
          } else {
            ctx.lineTo(pt.x, pt.y);
          }
        }
        ctx.stroke();
      }

      ctx.setLineDash([]);

      // 3. Letadlo
      if (progress <= 1) {
        const pCurrent = getPlanePath(progress, centerX, centerY, scale);
        const pNext = getPlanePath(Math.min(progress + 0.005, 1), centerX, centerY, scale);
        const angle = Math.atan2(pNext.y - pCurrent.y, pNext.x - pCurrent.x);
        drawPlane(pCurrent.x, pCurrent.y, angle);

        progress += speed;
        requestAnimationFrame(animate);
      } else if (!animationFinished) {
        animationFinished = true;
        
        // Vystřelení konfet v momentě doletu letadla
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.52 },
          colors: ['#a855f7', '#c084fc', '#e879f9', '#ffffff', '#818cf8'],
          shapes: ['circle', 'square']
        });

        // Zobrazení textu uvnitř srdce a spodního tlačítka
        setTimeout(() => {
          heartTextContainer.classList.add('show');
          nextBtn.classList.add('show');
        }, 300);
      }
    }

    let imagesLoaded = 0;
    function checkImagesLoaded() {
      imagesLoaded++;
      if (imagesLoaded === 2) {
        animate();
      }
    }

    planeImage.onload = checkImagesLoaded;
    starsImage.onload = checkImagesLoaded;

    if (planeImage.complete) checkImagesLoaded();
    if (starsImage.complete) checkImagesLoaded();

    function openDetails() {
      alert("Přechod na detail pozvánky...");
    }
  </script>
</body>
</html>
