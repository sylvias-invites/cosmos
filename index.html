<!DOCTYPE html>
<html lang="cs">
<head>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=block" rel="stylesheet">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Svatební pozvánka</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-image: url("pozadi.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: sans-serif;
    }

    .scratch-screen {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100%;
      width: 100%;
      max-width: 600px;
      padding: 40px 20px;
      z-index: 2;
    }

    .main-title {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #2c2c2c;
      margin-top: 42px;
      font-weight: normal;
      text-align: center;
      z-index: 10;
    }

    /* Plátno pro animaci letadel a postupně kresleného srdce */
    #animationCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Kontejner pro lístek uprostřed */
    .ticket-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      opacity: 0;
      visibility: hidden;
      transition: opacity 1s ease, transform 1s ease, visibility 1s;
      z-index: 6;
    }

    .ticket-container.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .banner-img {
      width: 290px;
      max-width: 80vw;
      height: auto;
      filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.15));
      border-radius: 8px;
    }

    /* Tlačítko dole */
    .next-btn {
      margin-bottom: 30px;
      padding: 12px 30px;
      background-color: rgba(255, 255, 255, 0.85);
      color: #2c2c2c;
      border: 1.5px solid #d4a373;
      border-radius: 30px;
      font-size: 0.95rem;
      letter-spacing: 1.5px;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease, transform 0.3s ease, background-color 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      backdrop-filter: blur(5px);
      z-index: 10;
    }

    .next-btn.show {
      opacity: 1;
      pointer-events: auto;
    }

    .next-btn:hover {
      background-color: #ffffff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }
  </style>
</head>
<body>

  <canvas id="animationCanvas"></canvas>

  <div class="scratch-screen" id="scratch-screen">
    <h1 class="main-title" id="main-title">Míša a Alex</h1>
    
    <!-- Lístek (původně skrytý) -->
    <div class="ticket-container" id="ticket-container">
      <img src="ticket.jpeg" alt="Svatební pozvánka" class="banner-img">
    </div>

    <button class="next-btn" id="next-btn" onclick="openDetails()">Vstoupit na pozvánku &rarr;</button>
  </div>

  <script>
    const canvas = document.getElementById('animationCanvas');
    const ctx = canvas.getContext('2d');
    const ticketContainer = document.getElementById('ticket-container');
    const nextBtn = document.getElementById('next-btn');

    const planeImage = new Image();
    planeImage.src = 'plane.png';

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Matematický bod na srdci (t od 0 do 1, kde 0 je nahoře a 1 je dole u špičky)
    function getHeartPoint(t, centerX, centerY, scale, isLeft) {
      const heartT = t * Math.PI;
      const sign = isLeft ? -1 : 1;
      const x = sign * 16 * Math.sin(heartT) ** 3;
      const y = -(13 * Math.cos(heartT) - 5 * Math.cos(2 * heartT) - 2 * Math.cos(3 * heartT) - Math.cos(4 * heartT));
      return {
        x: centerX + x * scale,
        y: centerY + y * scale
      };
    }

    // Celková trajektorie letadla rozdělená na 3 fáze:
    // 1. Přílet ze stran (0.0 až 0.3)
    // 2. Kreslení srdce od shora dolů (0.3 až 0.85)
    // 3. Odlet zpět do stran (0.85 až 1.0)
    function getPlanePath(progress, centerX, centerY, scale, isLeft) {
      const w = canvas.width;
      const h = canvas.height;

      const startX = isLeft ? -100 : w + 100;
      const startY = h * 0.75;

      const heartTop = getHeartPoint(0, centerX, centerY, scale, isLeft);
      const heartBottom = getHeartPoint(1, centerX, centerY, scale, isLeft);

      const endX = isLeft ? -150 : w + 150;
      const endY = h * 0.85;

      if (progress <= 0.3) {
        // FÁZE 1: Přílet ze strany k vrcholu srdce
        const p = progress / 0.3;
        const easeP = 1 - Math.pow(1 - p, 2);
        return {
          x: startX + (heartTop.x - startX) * easeP,
          y: startY + (heartTop.y - startY) * easeP,
          drawing: false
        };
      } else if (progress <= 0.85) {
        // FÁZE 2: Kreslení srdce (t jde od 0 do 1)
        const p = (progress - 0.3) / 0.55;
        const pt = getHeartPoint(p, centerX, centerY, scale, isLeft);
        return {
          x: pt.x,
          y: pt.y,
          drawing: true
        };
      } else {
        // FÁZE 3: Odlet ze špičky srdce zpět do stran
        const p = (progress - 0.85) / 0.15;
        const easeP = p * p;
        return {
          x: heartBottom.x + (endX - heartBottom.x) * easeP,
          y: heartBottom.y + (endY - heartBottom.y) * easeP,
          drawing: false
        };
      }
    }

    function drawPlane(x, y, angle) {
      if (!planeImage.complete) return;
      
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      
      const width = 60;
      const height = (planeImage.height / planeImage.width) * width;
      
      ctx.drawImage(planeImage, -width / 2, -height / 2, width, height);
      ctx.restore();
    }

    let progress = 0;
    const speed = 0.0022; // Rychlost animace
    let animationFinished = false;

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      const centerY = canvas.height * 0.52;
      const scale = Math.min(canvas.width, canvas.height) / 38;

      // Nastavení stylu pro bílou čárkovanou čáru (stoupu za letadly)
      ctx.beginPath();
      ctx.setLineDash([7, 7]);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.95)";
      ctx.lineWidth = 3.5;

      // 1. Kreslení levé poloviny srdce podle toho, kam až letadlo doletělo ve Fázi 2
      let leftDrawLimit = Math.min(Math.max((progress - 0.3) / 0.55, 0), 1);
      if (progress > 0.3) {
        let first = true;
        for (let i = 0; i <= leftDrawLimit; i += 0.005) {
          const pt = getHeartPoint(i, centerX, centerY, scale, true);
          if (first) {
            ctx.moveTo(pt.x, pt.y);
            first = false;
          } else {
            ctx.lineTo(pt.x, pt.y);
          }
        }
        ctx.stroke();
      }

      // 2. Kreslení pravé poloviny srdce
      ctx.beginPath();
      let rightDrawLimit = Math.min(Math.max((progress - 0.3) / 0.55, 0), 1);
      if (progress > 0.3) {
        let first = true;
        for (let i = 0; i <= rightDrawLimit; i += 0.005) {
          const pt = getHeartPoint(i, centerX, centerY, scale, false);
          if (first) {
            ctx.moveTo(pt.x, pt.y);
            first = false;
          } else {
            ctx.lineTo(pt.x, pt.y);
          }
        }
        ctx.stroke();
      }

      ctx.setLineDash([]); // Vypnout čárkování pro letadla

      // 3. Vykreslení letadel
      if (progress <= 1) {
        // Levé letadlo
        const pL = getPlanePath(progress, centerX, centerY, scale, true);
        const pLNext = getPlanePath(Math.min(progress + 0.005, 1), centerX, centerY, scale, true);
        const angleL = Math.atan2(pLNext.y - pL.y, pLNext.x - pL.x);
        drawPlane(pL.x, pL.y, angleL);

        // Pravé letadlo
        const pR = getPlanePath(progress, centerX, centerY, scale, false);
        const pRNext = getPlanePath(Math.min(progress + 0.005, 1), centerX, centerY, scale, false);
        const angleR = Math.atan2(pRNext.y - pR.y, pRNext.x - pR.x);
        drawPlane(pR.x, pR.y, angleR);

        progress += speed;
        requestAnimationFrame(animate);
      } else if (!animationFinished) {
        animationFinished = true;
        
        // Zobrazení lístku a tlačítka po dokončení letu
        setTimeout(() => {
          ticketContainer.classList.add('show');
          nextBtn.classList.add('show');
        }, 400);
      }
    }

    planeImage.onload = () => {
      animate();
    };

    function openDetails() {
      alert("Přechod na detail pozvánky...");
    }
  </script>
</body>
</html>
